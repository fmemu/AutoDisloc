[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autodisloc"
version = "2.0.0"
description = "Dislocation density of hcp titanium alloys (Ti-6Al-4V, CP-Ti) from X-ray line profile analysis (mWH, mWA, Wilkens whole-profile fitting)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Fırat Memu"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "openpyxl>=3.1", "matplotlib>=3.7", "pillow>=9"]
keywords = ["X-ray diffraction", "line profile analysis", "dislocation density", "Williamson-Hall", "Warren-Averbach", "Ti-6Al-4V", "titanium"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
test = ["pytest"]

[project.scripts]
autodisloc = "autodisloc.__main__:main"

[project.gui-scripts]
autodisloc-gui = "autodisloc.gui:main"

[tool.setuptools]
packages = ["autodisloc"]

[tool.setuptools.package-data]
autodisloc = ["data/*.json"]
